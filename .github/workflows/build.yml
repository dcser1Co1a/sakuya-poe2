name: Tests and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # a pushed version tag publishes a release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -W ignore -m unittest test_crafter test_price_check test_trade_search test_market_demand test_tools test_craft_plans test_stability test_build_items test_drop_sources test_level_steps test_game_watch test_loot_filter
      - name: Build
        run: pyinstaller --onefile --windowed --noconfirm --name Sakuya --icon assets/sakuya.ico --exclude-module pytest crafter.py
      - uses: actions/upload-artifact@v7
        with:
          name: Sakuya
          path: dist/Sakuya.exe
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Sakuya.exe --generate-notes
